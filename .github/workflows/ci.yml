name: backend-ci
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibios
          POSTGRES_PASSWORD: ibios_test_password
          POSTGRES_DB: ibios_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ibios -d ibios_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:push
        env:
          DATABASE_URL: postgresql://ibios:ibios_test_password@localhost:5432/ibios_test
      - run: npm run build
